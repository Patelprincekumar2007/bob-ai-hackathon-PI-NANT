submission:
  title: "SmartRoute AI - Supply Chain Disruption Assistant"

  problem_statement: >
    Supply chain teams need to quickly identify shipments affected by disruptions,
    assess their risk, find alternative routes and vehicles, and monitor
    temperature-sensitive cargo. Manual analysis across disruption, shipment,
    fleet, and cold-chain data can delay decisions and increase operational risk.

  solution_summary: >
    SmartRoute AI is an AI-powered supply chain disruption assistant that combines
    shipment risk analysis, disruption detection, route and vehicle recommendations,
    fleet optimisation, and cold-chain monitoring in one Streamlit dashboard.
    IBM watsonx.ai provides AI-generated shipment explanations, with a clearly
    labelled demo fallback when credentials are not configured.

  key_features:
    - "Shipment disruption detection and 0-100 risk scoring"
    - "Alternative route recommendations based on active disruptions"
    - "Fleet and vehicle optimisation with capacity and reefer requirements"
    - "Cold-chain temperature monitoring and excursion severity detection"
    - "AI-powered shipment explanations using IBM watsonx.ai"

  tech_stack:
    languages:
      - "Python"
    frameworks:
      - "Streamlit"
    ibm_technologies:
      - "IBM watsonx.ai"
      - "IBM Bob"
    databases: []
    other:
      - "Model Context Protocol (MCP)"
      - "GitHub Actions"
      - "JSON"

  what_we_are_most_proud_of: >
    We are most proud of integrating the complete supply chain decision workflow
    into one working application, from disruption detection and risk scoring to
    route and vehicle recommendations and cold-chain monitoring. We also
    implemented an MCP server exposing seven tools for AI-assisted interaction.

  known_limitations: >
    The application currently uses local JSON datasets for demonstration and
    does not have a live production deployment. IBM watsonx.ai requires valid
    credentials for real AI inference; otherwise the application uses a clearly
    labelled deterministic demo fallback.

